name: issb_prep
description: "ISSB Preparation App - Pakistan Army"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  sqflite: ^2.3.3
  path: ^1.9.0
  provider: ^6.1.2
  fl_chart: ^0.69.0
  google_fonts: ^6.2.1
  lottie: ^3.1.2
  shared_preferences: ^2.3.3
  percent_indicator: ^4.2.4
  intl: ^0.19.0
  animations: ^2.0.11
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/lottie/
